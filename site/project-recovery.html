<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects · Recovery Builder — Northstar Heritage</title>
<style>
:root{
  --sans:Inter,"Helvetica Neue",Helvetica,Arial,system-ui,-apple-system,"Segoe UI",sans-serif;
  --bg:#e7eee9; --paper:#eef2ec; --panel:#f5f8f4; --panel2:#e9eee9; --border:#d8e0d9; --border-strong:#c5d0c6;
  --text:#24342f; --ink:#24342f; --muted:#6f7d76; --dim:#8a948d;
  --crit:#c46f4f; --crit2:#9c6a52; --warn:#c99a35; --warn2:#a08f63; --watch:#d9c58f; --ok:#6f8790; --ok2:#5d7a6b;
  --blue:#536f62; --blue-deep:#314a42; --blue2:#314a42; --blue-soft:#e0e8e2; --navy:#314a42; --clay:#b88368;
  --accent:#536f62; --accent2:#314a42;
  --shadow:0 1px 2px rgba(42,60,53,.05),0 10px 28px rgba(42,60,53,.07);
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;}
body{color:var(--text); font-family:var(--sans); font-size:13px; letter-spacing:.1px; -webkit-font-smoothing:antialiased; background:radial-gradient(circle at 20% 0%, rgba(255,255,255,.85), transparent 32%),linear-gradient(135deg,#f7f8f4 0%,#e5ede7 45%,#d7e1da 100%); background-attachment:fixed;}
.app{display:flex; height:100vh; overflow:hidden;}
/* sidebar */
.sidebar{width:300px; flex-shrink:0; position:relative; overflow:hidden; margin:6px 0 6px 8px; height:calc(100vh - 12px); border-radius:22px; background:radial-gradient(circle at 50% 30%, rgba(255,255,255,.30), transparent 60%),linear-gradient(180deg,#e8ede7 0%,#dfe6df 52%,#d6ddd5 100%); border:1px solid rgba(255,255,255,.85); box-shadow:inset 0 1px 0 rgba(255,255,255,.95), inset 0 -1px 0 rgba(110,125,116,.10), 0 20px 60px rgba(60,75,68,.14), 0 40px 100px rgba(60,75,68,.10); display:flex; flex-direction:column;}
.sidebar::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.03;background:radial-gradient(circle at 22% 16%, rgba(255,255,255,.9), transparent 30%),radial-gradient(circle at 72% 40%, rgba(90,105,96,.5), transparent 32%),radial-gradient(circle at 38% 80%, rgba(255,255,255,.7), transparent 34%);mix-blend-mode:multiply;}
.sidebar>*{position:relative;}
.logo{padding:22px 20px 16px; display:flex; align-items:center; gap:12px; border-bottom:1px solid rgba(120,135,124,.18);}
.logo .mark{width:36px; height:40px;}
.logo .mark path{stroke:#53685f;}
.logo .mark circle{fill:#53685f;}
.logo .bt{font-weight:700; letter-spacing:.18em; font-size:14px; line-height:1; color:#23272e;}
.logo .bs{font-size:8.5px; letter-spacing:.14em; color:#536f62; margin-top:5px; text-transform:uppercase; font-weight:600;}
.nav{flex:0 0 auto; padding:10px 12px;}
.nav a{display:flex; align-items:center; gap:12px; padding:10px 13px; margin:3px 0; color:#28342f; text-decoration:none; font-size:13px; border-radius:11px; font-weight:600; letter-spacing:.2px; border:1px solid transparent; transition:background .15s,color .15s;}
.nav a svg{width:17px; height:17px; flex-shrink:0; stroke:#53685f;}
.nav a:hover{background:rgba(255,255,255,.32); color:#28342f;}
.nav a.active{background:linear-gradient(180deg, rgba(255,255,255,.92), rgba(245,247,244,.82)); border:1px solid rgba(255,255,255,.95); color:#28342f; box-shadow:0 12px 24px rgba(45,58,51,.08), 0 3px 8px rgba(45,58,51,.04), inset 0 1px 0 rgba(255,255,255,.95);}
.nav a.active svg{stroke:#53685f;}
.side-foot{padding:16px 20px; border-top:1px solid var(--border); font-size:12px; color:var(--dim);}
.side-foot .tag{color:var(--blue-deep); line-height:1.5;}
.side-foot a.home{display:block; margin-top:12px; color:var(--muted); text-decoration:none; font-size:11.5px;}
.side-foot a.home:hover{color:var(--ink);}
/* main */
.main{flex:1; min-width:0; display:flex; height:100vh;}
.plist{flex:1; min-height:0; border-top:1px solid var(--border); display:flex; flex-direction:column;}
.plist-head{padding:14px 16px 11px; border-bottom:1px solid var(--border);}
.plist-head h2{font-size:13px; letter-spacing:.6px; text-transform:uppercase; margin:0 0 12px; color:var(--ink); font-weight:600;}
.searchrow{display:flex; gap:8px;}
.searchrow input{flex:1; background:var(--panel2); border:1px solid var(--border); border-radius:8px; padding:8px 11px; color:var(--text); font-size:13px;}
.searchrow input::placeholder{color:var(--dim);}
.pmosel{width:100%; margin-top:8px; background:var(--panel2); border:1px solid var(--border); border-radius:8px; padding:8px 10px; color:var(--text); font-size:13px; cursor:pointer;}
.combo{position:relative; width:100%; margin-top:8px;}
.filter-row{display:flex; gap:8px;}
.filter-row .combo{flex:1 1 0; min-width:0;}
.filter-row .combo:last-child{flex:1.6 1 0;}
.combo-btn{display:flex; align-items:center; gap:8px; width:100%; padding:8px 12px; background:var(--panel2); color:var(--text); border:1px solid var(--border); border-radius:999px; cursor:pointer; font-family:var(--sans); text-align:left; transition:background .15s,border-color .15s;}
.combo-btn:hover{border-color:var(--border-strong);}
.combo-blabel{font-size:10px; text-transform:uppercase; letter-spacing:.1em; font-weight:700; color:var(--muted); flex:0 0 auto;}
.combo-bval{flex:0 1 auto; min-width:0; font-size:12px; font-weight:700; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.combo-bval:empty{display:none;}
.combo-caret{flex:0 0 auto; margin-left:auto; font-size:10px; color:var(--muted);}
.combo-btn.active{background:var(--accent); border-color:var(--accent2);}
.combo-btn.active .combo-blabel,.combo-btn.active .combo-bval,.combo-btn.active .combo-caret{color:var(--paper);}
.combo-menu{position:absolute; top:calc(100% + 6px); left:0; z-index:50; width:268px; max-width:calc(100vw - 40px); max-height:360px; display:flex; flex-direction:column; overflow:hidden; background:var(--panel); border:1px solid var(--border-strong); border-radius:8px; box-shadow:0 6px 18px rgba(42,60,53,.18);}
.filter-row .combo:first-child .combo-menu{left:0; right:auto;}
.filter-row .combo:last-child .combo-menu{left:auto; right:0;}
.combo-menu[hidden]{display:none;}
.combo-search-wrap{padding:6px; border-bottom:1px solid var(--border); background:var(--panel2);}
.combo-search{width:100%; box-sizing:border-box; padding:6px 9px; font-family:var(--sans); font-size:12px; color:var(--text); background:var(--panel); border:1px solid var(--border); border-radius:6px; outline:none;}
.combo-search:focus{border-color:var(--accent);}
.combo-search::placeholder{color:var(--dim);}
.combo-options{overflow:auto; padding:4px;}
.combo-opt{padding:6px 10px; font-size:13px; color:var(--text); border-radius:5px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.combo-opt:hover{background:var(--blue-soft);}
.combo-opt.active{background:var(--blue-soft); outline:1px solid var(--accent); outline-offset:-1px;}
.combo-opt.cur{background:var(--accent); color:var(--paper); font-weight:700;}
.combo-opt.cur.active{outline:1px solid var(--accent2);}
.combo-empty{padding:6px 10px; font-size:13px; color:var(--muted);}
.plist-body{flex:1; overflow-y:auto;}
.pitem{padding:11px 16px; border-bottom:1px solid var(--border); cursor:pointer; border-left:3px solid transparent;}
.pitem:hover{background:rgba(255,255,255,.4);}
.pitem.sel{background:var(--blue-soft); border-left-color:var(--blue-deep);}
.pitem .pid{font-weight:700; font-size:13px;}
.pitem .pnm{color:var(--muted); font-size:12px; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.pitem .prow{display:flex; align-items:center; gap:10px; margin-top:7px; font-size:11.5px;}
.pitem .neg{color:var(--crit2); font-weight:700;}
.pitem .zero{color:var(--dim);}
.badge{display:inline-block; font-size:10.5px; font-weight:600; padding:3px 9px; border-radius:6px; color:#fff;}
.badge.C{background:var(--crit);} .badge.W{background:var(--warn); color:#3c3318;} .badge.T{background:var(--watch); color:#3c3318;}
.plist-foot{padding:10px 18px; font-size:11px; color:var(--dim); border-top:1px solid var(--border);}
/* detail */
.pdetail{flex:1; min-width:0; min-height:0; overflow:hidden; padding:18px 24px 18px; display:flex; flex-direction:column;}
#tabbody{flex:1 1 0; min-height:0; display:flex; flex-direction:column;}
#tabbody>.rb{flex:none;}
.tbd-card{flex:1 1 0; min-height:0; display:flex; flex-direction:column;}
.dhead{position:relative; overflow:hidden; color:#fff; background:radial-gradient(circle at 88% 12%, rgba(255,255,255,.20), transparent 32%),linear-gradient(90deg,#7c8d86 0%,#687970 45%,#55675f 100%); border-radius:16px; padding:13px 22px; box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 14px 32px rgba(55,73,65,.16);}
.dhead::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:.03;background-image:radial-gradient(circle, rgba(0,0,0,.5) .6px, transparent .7px);background-size:5px 5px;mix-blend-mode:multiply;}
.dhead h1{position:relative; font-size:18px; margin:0; font-weight:700; color:#fff; display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
.dhead h1 .pid{color:rgba(255,255,255,.72); font-weight:700;}
.dhead .sub{position:relative; color:rgba(255,255,255,.78); font-size:13px; margin-top:5px;}
.tabs{display:flex; gap:4px; margin:16px 0 0; border-bottom:1px solid var(--border); flex-wrap:wrap;}
.tabs button{background:none; border:none; color:var(--muted); font-size:13px; padding:9px 14px; cursor:pointer; border-bottom:2px solid transparent; font-weight:500;}
.tabs button:hover{color:var(--text);}
.tabs button.active{color:var(--blue-deep); border-bottom-color:var(--blue-deep); font-weight:600;}
.rb{display:grid; grid-template-columns:215px 1fr 280px; gap:16px; margin-top:18px;}
.card{background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:15px 17px; box-shadow:var(--shadow);}
.card h3{font-size:11px; letter-spacing:.6px; text-transform:uppercase; color:var(--muted); margin:0 0 13px; font-weight:600;}
.card h3.ico{display:flex; align-items:center; gap:10px;}
.hico{display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; min-width:28px; border-radius:8px; background:var(--blue-soft); line-height:1;}
.hico svg{width:16px; height:16px; color:var(--blue-deep);}
.stat{margin-bottom:16px;}
.stat .lbl{font-size:11.5px; color:var(--muted);}
.stat .val{font-size:25px; font-weight:800; margin-top:2px;}
.stat .sub2{font-size:12px; font-weight:600; margin-top:1px;}
.stat .neg{color:var(--crit);} .stat .negsub{color:var(--crit2);}
.atable{width:100%; border-collapse:collapse;}
.atable th{font-size:10.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); text-align:left; font-weight:600; padding:0 8px 9px;}
.atable th.r,.atable td.r{text-align:right;}
.atable th.c,.atable td.c{text-align:center;}
.atable td{padding:9px 8px; border-top:1px solid var(--border); font-size:12.5px; vertical-align:middle;}
.atable .anm{font-weight:600;}
.atable .aedit{width:100%; box-sizing:border-box; font-family:var(--sans); font-size:12.5px; font-weight:600; color:var(--text); background:transparent; border:1px solid transparent; border-radius:6px; padding:5px 7px; transition:background .12s,border-color .12s;}
.atable .aedit:hover{background:var(--panel2); border-color:var(--border);}
.atable .aedit:focus{outline:none; background:var(--panel2); border-color:var(--accent);}
.atable .aty{font-size:11px; color:var(--muted);}
.tag2{display:inline-block; font-size:10px; font-weight:700; padding:2px 7px; border-radius:5px;}
.tag2.cost,.tag2.res,.tag2.sched,.tag2.scope,.tag2.proc{background:var(--blue-soft); color:var(--blue-deep);}
.atable input.imp{width:74px; background:var(--panel2); border:1px solid var(--border); border-radius:6px; color:#1f2e26; font-size:12px; padding:4px 6px; text-align:right;}
.atable input.imph{color:#1f2e26;}
.atable .lv{font-size:11.5px;}
.atable .lv.High,.atable .lv.Medium,.atable .lv.Low{color:#1f2e26;}
.atable .confsel.High,.atable .confsel.Medium,.atable .confsel.Low{color:#1f2e26;}
.atable .lvsel{background:var(--panel2); border:1px solid var(--border); border-radius:6px; padding:3px 6px; font-size:11.5px; font-weight:400; cursor:pointer; color:#1f2e26;}
.atable .delx{background:none; border:none; color:var(--dim); font-size:17px; line-height:1; cursor:pointer; padding:0 4px;}
.atable .delx:hover{color:var(--crit2);}
.addbtn{margin-top:12px; background:var(--blue-soft); border:1px dashed #aebfcf; color:var(--blue-deep); border-radius:8px; padding:8px 13px; font-size:12.5px; cursor:pointer; font-weight:600;}
.rbhead{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:14px;}
.rbhead .htxt h3{margin:0 0 4px;}
.rbhead .hsub{font-size:11.5px; color:var(--muted); white-space:nowrap;}
.rbhead .aihint{color:var(--accent2); margin-top:7px;}
.hbtns{display:flex; align-items:center; gap:10px; flex:none;}
.hbtns .addbtn{margin-top:0; white-space:nowrap;}
.aibtn{display:inline-flex; align-items:center; gap:6px; background:transparent; border:1px solid var(--border); color:var(--text); border-radius:8px; padding:8px 13px; font-size:12.5px; font-weight:600; cursor:pointer; white-space:nowrap;}
.aibtn:hover{background:var(--panel2); border-color:var(--border-strong);}
.aibtn svg{width:14px; height:14px; color:var(--accent2);}
.addbtn:hover{background:#dfe6ee;}
.improw{display:flex; justify-content:space-between; align-items:flex-end; padding:11px 0; border-bottom:1px solid var(--border);}
.improw .il{font-size:11.5px; color:var(--muted);}
.improw .iv{font-size:17px; font-weight:800; margin-top:2px;}
.improw .imp2{text-align:right; font-size:12px; font-weight:700;}
.improw .good{color:var(--ok2);} .improw .bad{color:var(--crit2);} .improw .flat{color:var(--dim);}
.imphdr{display:flex; justify-content:space-between; font-size:10px; letter-spacing:.4px; color:var(--dim); text-transform:uppercase; margin-bottom:4px;}
.savebtn{width:100%; margin-top:16px; background:var(--blue-deep); border:none; color:#fff; border-radius:9px; padding:11px; font-size:13.5px; font-weight:600; cursor:pointer;}
.savebtn:hover{background:var(--navy);}
.resetbtn{width:100%; margin-top:9px; background:none; border:1px solid var(--border); color:var(--muted); border-radius:9px; padding:9px; font-size:12.5px; cursor:pointer;}
.resetbtn:hover{color:var(--ink); background:rgba(83,111,98,.10);}
.btncell{padding:12px 16px; border-left:1px solid var(--border); display:flex; flex-direction:column; justify-content:center; gap:8px; min-width:158px;}
.btncell .addbtn,.btncell .resetbtn{width:100%; margin-top:0; text-align:center;}
.saved{font-size:11.5px; color:var(--ok2); text-align:center; margin-top:9px; min-height:14px;}
.notes{width:100%; min-height:90px; resize:vertical; background:var(--panel2); border:1px solid var(--border); border-radius:9px; color:var(--text); font-size:13px; padding:10px 12px; font-family:inherit; line-height:1.5;}
.notes.sm{min-height:120px; font-size:12px; padding:8px 10px;}
.notesec{margin-top:16px; padding-top:14px; border-top:1px solid var(--border);}
.notesec h3{margin-bottom:9px;}
.notemeta{font-size:11px; color:var(--dim); margin-top:7px;}
.ttable{width:100%; border-collapse:collapse; font-size:12px; margin-top:6px;}
.ttable th{text-align:right; color:var(--dim); font-weight:600; font-size:10px; letter-spacing:.04em; text-transform:uppercase; padding:6px 8px; border-bottom:1px solid var(--border); white-space:nowrap; position:sticky; top:0; background:var(--panel);}
.ttable th:first-child{text-align:left;}
.ttable td{padding:6px 8px; border-bottom:1px solid var(--border);}
.ttable td.tnm{text-align:left; color:var(--ink); max-width:360px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.ttable td.r{text-align:right; font-variant-numeric:tabular-nums; color:var(--text);}
.ttable td.neg{color:var(--crit);}
.ttable td.pos{color:#4a8c63;}
.ttable tr.tot td{border-top:2px solid var(--border-strong); border-bottom:none; font-weight:700; color:var(--ink); padding-top:9px;}
.twrap{flex:1 1 0; min-height:0; overflow-y:auto; margin-top:8px;}
.tgrp{font-size:11px; color:var(--muted); margin:-4px 0 8px;}
.thead-row{position:relative; overflow:hidden; display:flex; align-items:center; justify-content:space-between; gap:12px; margin:0 0 12px; padding:10px 16px; border-radius:12px; color:#fff; background:radial-gradient(circle at 90% 15%, rgba(255,255,255,.20), transparent 34%),linear-gradient(90deg,#7c8d86 0%,#687970 45%,#55675f 100%); box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 10px 24px rgba(55,73,65,.14);}
.thead-row::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:.03;background-image:radial-gradient(circle, rgba(0,0,0,.5) .6px, transparent .7px);background-size:5px 5px;mix-blend-mode:multiply;}
.thead-row h3{position:relative; color:#fff;}
.thead-row .hico{position:relative; background:rgba(255,255,255,.18);}
.thead-row .hico svg{color:#fff;}
.tsort{position:relative; display:flex; align-items:center; gap:8px; font-size:11.5px; color:rgba(255,255,255,.82); white-space:nowrap;}
.tsort select{background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.42); color:#fff; border-radius:7px; font-size:12px; padding:5px 8px; cursor:pointer;}
.tsort select option{color:#28342f; background:#fff;}
.tfoot{font-size:10.5px; color:var(--dim); margin-top:8px;}
.isum{display:grid; grid-template-columns:1fr 1fr 1fr auto; align-items:stretch; margin-top:16px; background:var(--panel2); border:1px solid var(--border); border-radius:12px; overflow:hidden;}
.isum .cell{display:flex; align-items:center; gap:13px; padding:14px 16px;}
.isum .cell+.cell{border-left:1px solid var(--border);}
.isum .ib{width:36px; height:36px; min-width:36px; border-radius:10px; display:inline-flex; align-items:center; justify-content:center; background:rgba(35,39,46,.05); color:var(--muted);}
.isum .ib svg{width:19px; height:19px;}
.isum .ib.blue{background:var(--blue-soft); color:var(--blue-deep);}
.isum .ib.amber{background:rgba(194,163,95,.18); color:var(--warn2);}
.isum .ib.green{background:rgba(125,155,127,.2); color:var(--ok2);}
.isum .tl{font-size:9.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--dim); margin-bottom:2px;}
.isum .bigv{font-size:21px; font-weight:700; color:var(--text); line-height:1.05;}
.isum .bigv.green{color:var(--ok2);}
.isum .sl{font-size:10.5px; color:var(--muted); margin-top:2px;}
.nameRow input{width:100%; background:var(--panel2); border:1px solid var(--border); border-radius:8px; padding:7px 10px; color:var(--text); font-size:12px; margin-bottom:10px;}
.nameRow input::placeholder{color:var(--dim);}
.ioBtn{display:block; width:100%; text-align:left; background:var(--blue-soft); border:1px solid #cdd9e3; color:var(--blue-deep); border-radius:8px; padding:8px 11px; font-size:12px; font-weight:600; cursor:pointer; margin-bottom:7px;}
.ioBtn:hover{background:#dfe6ee;}
.ioBtn.ghost{background:none; border:1px solid var(--border); color:var(--muted);}
.ioBtn.ghost:hover{background:rgba(83,111,98,.10); color:var(--ink);}
.placeholder{color:var(--dim); padding:40px; text-align:center; font-size:14px;}
@media(max-width:1200px){.rb{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo">
      <svg class="mark" viewBox="0 0 42 46" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M21 2 L39 12 V34 L21 44 L3 34 V12 Z" stroke="#b3805f" stroke-width="2.2" fill="rgba(179,128,95,0.07)"/>
        <path d="M21 14 L30 31 H12 Z" stroke="#c2a35f" stroke-width="2" fill="none" stroke-linejoin="round"/>
        <rect x="20" y="20" width="2" height="6" rx="1" fill="#c2a35f"/><circle cx="21" cy="28.5" r="1.2" fill="#c2a35f"/>
      </svg>
      <div>
        <div class="bt">NORTHSTAR</div>
        <div class="bs">Project Recovery</div>
      </div>
    </div>
    <nav class="nav">
      <a href="early-warning-system.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Dashboard</a>
      <a class="active" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Projects</a>
    </nav>
    <div class="plist">
      <div class="plist-head">

function defaultActions(p){
  return TEMPLATES.map((t,idx)=>({id:'t'+idx, name:t.name, type:t.type, cls:t.cls, cost:0, hours:0, effort:t.effort, conf:t.conf, on:false}));
}
function loadActions(p){
  const plan=loadPlan(p.id);
  if(plan && Array.isArray(plan.actions) && plan.actions.length){
    actions=plan.actions.map(a=>({...a})); curNotes=plan.notes||'';
  } else if(plan){ // legacy {on,removed,custom}
    const removed=plan.removed||[];
    actions=defaultActions(p).map(a=>({...a, on:(plan.on||[]).includes(a.id)})).filter(a=>!removed.includes(a.id));
    (plan.custom||[]).forEach((c,k)=>actions.push({id:'c'+k, name:c.name, type:'Custom', cls:'proc', cost:c.cost, hours:c.hours, effort:c.effort||'Medium', conf:c.conf||'Medium', on:true}));
    curNotes=plan.notes||'';
  } else { actions=defaultActions(p); curNotes=''; }
}

function sortTasks(rows, key){
  const a=rows.slice();
  const c={ovr_desc:(x,y)=>y[3]-x[3], ovr_asc:(x,y)=>x[3]-y[3], spent_desc:(x,y)=>y[2]-x[2], bud_desc:(x,y)=>y[1]-x[1], name_asc:(x,y)=>String(x[0]).localeCompare(String(y[0]))}[key] || ((x,y)=>y[3]-x[3]);
  return a.sort(c);
}

function taskRowsHTML(p, key){
  const rows=sortTasks((window.PROJECT_TASKS||{})[p.id]||[], key);
  let tb=0,ts=0,to=0,tbh=0,tah=0,toh=0;
  const body=rows.map(t=>{
    const nm=t[0], bud=t[1], spent=t[2], ovr=t[3], budH=t[4], actH=t[5], ovrH=t[6];
    tb+=bud; ts+=spent; to+=ovr; tbh+=budH; tah+=actH; toh+=ovrH;
    return `<tr>
      <td class="tnm" title="${esc(nm)}">${esc(nm)}</td>
      <td class="r">${usd(bud)}</td>
      <td class="r">${usd(spent)}</td>
      <td class="r ${(bud-spent)<0?'neg':'pos'}">${(bud-spent)<0?'-'+usd(spent-bud):'+'+usd(bud-spent)}</td>
      <td class="r">${fmtNum(budH)}</td>
      <td class="r">${fmtNum(actH)}</td>
      <td class="r ${ovrH>0?'neg':''}">${ovrH>0?fmtNum(ovrH):'—'}</td>
    </tr>`;
  }).join('');
  const tot=`<tr class="tot">
      <td class="tnm">Total — ${rows.length} task${rows.length===1?'':'s'}</td>
      <td class="r">${usd(tb)}</td>
      <td class="r">${usd(ts)}</td>

      <td class="r">${fmtNum(tbh)}</td>
      <td class="r">${fmtNum(tah)}</td>
      <td class="r ${toh>0?'neg':''}">${toh>0?fmtNum(toh):'—'}</td>
    </tr>`;
  return body+tot;
}

    tr.querySelector('.achk').addEventListener('change',e=>{a.on=e.target.checked; recompute(); saveCurrent();});
    const ci=tr.querySelector('.cimp'); ci.addEventListener('input',e=>{a.cost=Math.round(parseFloat(e.target.value.replace(/,/g,''))||0); recompute(); saveCurrent();}); ci.addEventListener('blur',e=>{e.target.value=a.cost?fmtNum(a.cost):'';});
    const hi=tr.querySelector('.himp'); hi.addEventListener('input',e=>{a.hours=Math.round(parseFloat(e.target.value.replace(/,/g,''))||0); recompute(); saveCurrent();}); hi.addEventListener('blur',e=>{e.target.value=a.hours?fmtNum(a.hours):'';});
    const nm=tr.querySelector('.aedit'); if(nm) nm.addEventListener('input',e=>{a.name=e.target.value; saveCurrent();});
    const es=tr.querySelector('.effsel'); es.addEventListener('change',e=>{a.effort=e.target.value; es.className='lvsel effsel lv '+e.target.value; saveCurrent();});
    const cs=tr.querySelector('.confsel'); cs.addEventListener('change',e=>{a.conf=e.target.value; cs.className='lvsel confsel lv '+e.target.value; saveCurrent();});
    tr.querySelector('.delx').addEventListener('click',()=>{ actions=actions.filter(x=>x.id!==id); renderActions(); recompute(); saveCurrent(); });
  });
}

function recompute(){
  const p=P[cur];
  let dc=0,dh=0;
  actions.forEach(a=>{ if(a.on){ dc+=a.cost; dh+=a.hours; }});
  const facNew=p.fac+dc, coNew=Math.max(0,p.co+dc), hacNew=p.hac+dh, hoNew=p.ho+dh;
  const facPct=p.fac? (dc/p.fac*100):0, coPct=p.co? (dc/p.co*100):0;
  const row=(lbl,val,imp,impcls)=>`<div class="improw"><div><div class="il">${lbl}</div><div class="iv">${val}</div></div><div class="imp2 ${impcls}">${imp}</div></div>`;
  document.getElementById('impbody').innerHTML=
    row('Forecast at Completion', fmtMoney(facNew), dc?`${fmtMoney(dc)} (${facPct.toFixed(1)}%)`:'—', dc?'good':'flat')+
    row('Cost Overrun', fmtMoney(-coNew), dc?`${fmtMoney(-dc)} (${(-coPct).toFixed(1)}%)`:'—', dc?'good':'flat')+
    row('Hours Overrun', signNum(hoNew), dh?signNum(dh):'—', dh?'good':'flat');
  const sc=document.getElementById('sumCost');
  if(sc){
    sc.textContent=usdSigned(dc);
    const sh=document.getElementById('sumHours');
    sh.textContent=signNum(dh);
    sh.classList.toggle('green', hoNew<=0);
    document.getElementById('sumHoursIb').classList.toggle('green', hoNew<=0);
    const sf=document.getElementById('sumFc');
    sf.textContent=fmtMoney(facNew);
    sf.classList.toggle('green', facNew<=p.bud);
    document.getElementById('sumFcIb').classList.toggle('green', facNew<=p.bud);
    document.getElementById('sumFcSub').textContent='vs. current '+fmtMoney(p.fac);
  }
}

// persistence (localStorage working copy)
function savePlan(id,plan){try{localStorage.setItem('rb_'+id,JSON.stringify(plan));}catch(e){}}
function loadPlan(id){try{const s=localStorage.getItem('rb_'+id);return s?JSON.parse(s):null;}catch(e){return null;}}
function clearPlan(id){try{localStorage.removeItem('rb_'+id);}catch(e){}}

// merge the shared recovery_plans.js (if present) into the local working copy, newest wins
(function mergeShared(){
  const shared=window.RECOVERY_PLANS||{};
  for(const id in shared){
    const local=loadPlan(id);
    if(!local || ((shared[id]||{}).ts||0) > (local.ts||0)) savePlan(id, shared[id]);
  }
})();

function allPlans(){
  const all={};
  for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k && k.indexOf('rb_')===0 && k!=='rb_user'){ try{all[k.slice(3)]=JSON.parse(localStorage.getItem(k));}catch(e){} } }
  return all;
}
function exportPlans(){
  const blob=new Blob(['window.RECOVERY_PLANS='+JSON.stringify(allPlans())+';'],{type:'text/javascript'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='recovery_plans.js';
  document.body.appendChild(a); a.click(); a.remove();
}
function importPlans(file){
  const r=new FileReader();
  r.onload=()=>{
    let obj=null, txt=r.result||'';
    try{ obj=JSON.parse(txt.replace(/^[\s\S]*?window\.RECOVERY_PLANS\s*=\s*/,'').replace(/;\s*$/,'')); }
    catch(e){ try{ obj=JSON.parse(txt); }catch(e2){ alert('Could not read that plans file.'); return; } }
    let n=0;
    for(const id in obj){ const local=loadPlan(id); if(!local || ((obj[id]||{}).ts||0) > (local.ts||0)){ savePlan(id,obj[id]); n++; } }
    alert('Imported / updated '+n+' plan(s).');
    select(cur==null?0:cur);
  };
  r.readAsText(file);
}

// ---- shared save: write recovery_plans.js so other users see the edits ----
// The dashboard loads recovery_plans.js on open and merges it (newest wins), so
// writing that file is how a change reaches everyone. We write it directly with
// the File System Access API (one-time file pick, remembered in IndexedDB);
// if the browser blocks that (e.g. page opened as a local file), we fall back to
// downloading recovery_plans.js, which is then dropped into the shared folder.
const SHARED_FILE='recovery_plans.js';
function sharedContent(){ return 'window.RECOVERY_PLANS='+JSON.stringify(allPlans())+';\n'; }
function idbOpen(){ return new Promise((res,rej)=>{ const r=indexedDB.open('rb_fs',1); r.onupgradeneeded=()=>r.result.createObjectStore('h'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbGet(k){ try{ const db=await idbOpen(); return await new Promise((res,rej)=>{ const t=db.transaction('h','readonly').objectStore('h').get(k); t.onsuccess=()=>res(t.result); t.onerror=()=>rej(t.error); }); }catch(e){ return null; } }
async function idbSet(k,v){ try{ const db=await idbOpen(); await new Promise((res,rej)=>{ const t=db.transaction('h','readwrite').objectStore('h').put(v,k); t.onsuccess=()=>res(); t.onerror=()=>rej(t.error); }); }catch(e){} }
async function ensurePerm(h){ if(!h) return false; const o={mode:'readwrite'}; if((await h.queryPermission(o))==='granted') return true; return (await h.requestPermission(o))==='granted'; }
function parsePlans(txt){
  if(!txt) return {};
  try{ return JSON.parse(txt.replace(/^[\s\S]*?window\.RECOVERY_PLANS\s*=\s*/,'').replace(/;\s*$/,'')); }
  catch(e){ try{ return JSON.parse(txt); }catch(e2){ return {}; } }
}
// Merge what's on disk (other people's saves) with our local plans, newest ts
// wins per project. Any newer disk plan is also adopted into our localStorage so
// our own view stays current. Returns the union to write back.
function mergePlans(disk){
  const local=allPlans(), out={};
  const ids=new Set([...Object.keys(disk||{}), ...Object.keys(local)]);
  ids.forEach(id=>{
    const d=disk?disk[id]:null, l=local[id];
    const dNewer = d && (!l || (d.ts||0) > (l.ts||0));
    out[id]= dNewer ? d : (l||d);
    if(dNewer) savePlan(id,d);
  });
  return out;
}
async function writeShared(){
  if(!window.showSaveFilePicker) throw new Error('unsupported');
  let h=await idbGet('shared');
  if(h && !(await ensurePerm(h))) h=null;
  if(!h){
    h=await window.showSaveFilePicker({suggestedName:SHARED_FILE, types:[{description:'Recovery plans', accept:{'text/javascript':['.js']}}]});
    if(!(await ensurePerm(h))) throw new Error('denied');
    await idbSet('shared',h);
  }
  // read-merge-write: re-read the file first so a concurrent editor's save to a
  // different project isn't clobbered; newest ts wins per project.
  let disk={};
  try{ const f=await h.getFile(); disk=parsePlans(await f.text()); }catch(e){}
  const merged=mergePlans(disk);
  const w=await h.createWritable(); await w.write('window.RECOVERY_PLANS='+JSON.stringify(merged)+';\n'); await w.close();
}
function downloadShared(){
  const blob=new Blob([sharedContent()],{type:'text/javascript'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=SHARED_FILE;
  document.body.appendChild(a); a.click(); a.remove();
}
async function saveShared(){
  saveCurrent();                       // local working copy first (instant)
  try{ await writeShared(); return 'shared'; }
  catch(e){ if(e && e.name==='AbortError') return 'cancel'; downloadShared(); return 'download'; }
}

// Turn a filter <select> into a pill-button combobox with a searchable menu,
// matching the PM Hours / Expenses filter control. The hidden <select> stays
// the source of truth for .value, so renderList() and populatePMs() keep
// working unchanged; a MutationObserver re-syncs whenever the option list is
// rebuilt.
function makeCombo(sel, label, placeholder){
  const wrap=document.createElement('div'); wrap.className='combo';
  sel.parentNode.insertBefore(wrap,sel); wrap.appendChild(sel); sel.style.display='none';

  const esc=s=>s.replace(/"/g,'&quot;');
  const btn=document.createElement('button'); btn.type='button'; btn.className='combo-btn';
  btn.setAttribute('aria-haspopup','listbox'); btn.setAttribute('aria-expanded','false');
  btn.innerHTML='<span class="combo-blabel">'+esc(label)+'</span><span class="combo-bval"></span><span class="combo-caret">▾</span>';
  const bval=btn.querySelector('.combo-bval');

  const menu=document.createElement('div'); menu.className='combo-menu'; menu.hidden=true; menu.setAttribute('role','listbox');
  const searchWrap=document.createElement('div'); searchWrap.className='combo-search-wrap';
  const search=document.createElement('input'); search.type='search'; search.className='combo-search'; search.placeholder=placeholder; search.autocomplete='off';
  searchWrap.appendChild(search); menu.appendChild(searchWrap);
  const list=document.createElement('div'); list.className='combo-options'; menu.appendChild(list);
  wrap.appendChild(btn); wrap.appendChild(menu);

  let opts=[], active=-1;
  const optHtml=o=>`<div class="combo-opt${o.value===sel.value?' cur':''}" role="option" data-v="${esc(o.value)}">${o.label}</div>`;
  function readOpts(){ opts=[...sel.options].map(o=>({value:o.value,label:o.textContent})); }
  function syncBtn(){ const v=sel.value; const a=opts.find(o=>o.value===v); bval.textContent = v==='' ? '' : (a?a.label:''); btn.classList.toggle('active', v!==''); }
  function render(filter){
    const f=(filter||'').trim().toLowerCase();
    const all=opts.find(o=>o.value==='');
    const rest=opts.filter(o=>o.value!=='');
    const matches=f ? rest.filter(o=>o.label.toLowerCase().includes(f)) : rest;
    let html=all?optHtml(all):'';
    html += matches.length ? matches.map(optHtml).join('') : (f?'<div class="combo-empty">No matches</div>':'');
    list.innerHTML=html||'<div class="combo-empty">No matches</div>';
    active=-1;
  }
  function open(){ readOpts(); render(''); search.value=''; menu.hidden=false; btn.setAttribute('aria-expanded','true'); search.focus(); }
  function close(){ menu.hidden=true; btn.setAttribute('aria-expanded','false'); }
  function choose(v){ sel.value=v; syncBtn(); close(); btn.focus(); sel.dispatchEvent(new Event('change',{bubbles:true})); }

  btn.addEventListener('click',()=>{ menu.hidden?open():close(); });
  search.addEventListener('input',()=>render(search.value));
  search.addEventListener('keydown',e=>{
    const items=[...list.querySelectorAll('.combo-opt')];
    if(e.key==='ArrowDown'){ e.preventDefault(); active=Math.min(active+1,items.length-1); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); active=Math.max(active-1,0); }
    else if(e.key==='Enter'){ e.preventDefault(); if(active>=0&&items[active])choose(items[active].dataset.v); else if(items.length===1)choose(items[0].dataset.v); return; }
    else if(e.key==='Escape'){ close(); btn.focus(); return; }
    else return;
    items.forEach((el,i)=>el.classList.toggle('active',i===active));
    if(items[active])items[active].scrollIntoView({block:'nearest'});
  });
  list.addEventListener('mousedown',e=>{ const o=e.target.closest('.combo-opt'); if(o){ e.preventDefault(); choose(o.dataset.v); } });
  document.addEventListener('mousedown',e=>{ if(!wrap.contains(e.target)) close(); });

  // keep button + menu in sync when the <select> is rebuilt
  new MutationObserver(()=>{ readOpts(); syncBtn(); if(!menu.hidden) render(search.value); }).observe(sel,{childList:true});
  readOpts(); syncBtn();
}
makeCombo(document.getElementById('pmoFilter'),'PMO','Search PMOs…');
makeCombo(document.getElementById('pmFilter'),'Project Manager','Search PMs…');
